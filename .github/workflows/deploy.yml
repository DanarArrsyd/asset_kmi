name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys interleave — the unpack step extracts a zip in
# place on the server, so a second run landing mid-extract corrupts it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build and deploy
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify deploy secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          APP_URL: ${{ secrets.APP_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          missing=()
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR APP_URL DEPLOY_TOKEN; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing repository secrets: ${missing[*]}"
            echo "Set them under Settings -> Secrets and variables -> Actions (see DEPLOYMENT.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, dom, fileinfo
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Stamps the build so two deploys of the same commit still produce
      # different bytes — the FTP action skips uploads whose hash matches
      # its server-side state file, which would leave unpack.php with no
      # zip to extract.
      - name: Stamp the build
        run: |
          printf 'commit=%s\nrun=%s\nref=%s\n' \
            "${{ github.sha }}" "${{ github.run_id }}" "${{ github.ref_name }}" \
            > .deploy-build

      - name: Zip the build (FTP upload is one file, not thousands)
        run: |
          zip -r -q ../deploy.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" \
               "design-preview/*" "deploy/*" \
               "storage/logs/*.log" "storage/app/public/*" \
               "bootstrap/cache/config.php" "bootstrap/cache/routes-*.php" \
               ".env" ".env.example" "phpunit.xml"
          mv ../deploy.zip deploy.zip
          ls -lh deploy.zip

      - name: Upload unpack.php (standalone, outside the zip)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          state-name: .ftp-deploy-unpack-state.json

      - name: Upload deploy.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # This action has no `include` input — exclude-everything plus a
          # negation is the only way to upload a single file.
          exclude: |
            **/*
            !deploy.zip
          state-name: .ftp-deploy-zip-state.json
          dangerous-clean-slate: false

      - name: Unpack on the server
        run: |
          curl -sSf --max-time 300 -X POST \
            "${{ secrets.APP_URL }}/unpack.php?token=${{ secrets.DEPLOY_TOKEN }}" \
            || {
              echo "Unpack failed. Check that FTP_SERVER_DIR/public/unpack.php uploaded"
              echo "and that DEPLOY_TOKEN matches DEPLOY_TOKEN in the server .env."
              exit 1
            }

      - name: Run migrations (no SSH on host)
        run: |
          curl -sSf --max-time 300 -X POST \
            "${{ secrets.APP_URL }}/deploy/migrate?token=${{ secrets.DEPLOY_TOKEN }}" \
            || {
              echo "Migration endpoint failed. The new code is already live but the"
              echo "database schema and caches were NOT updated — fix and re-run."
              exit 1
            }
