name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, imagick, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Zip the build (FTP upload is one file, not thousands)
        run: |
          zip -r -q ../deploy.zip . \
            -x ".git/*" ".github/*" "node_modules/*" "tests/*" \
               "design-preview/*" "deploy/*" "storage/logs/*.log" \
               ".env" ".env.example"
          mv ../deploy.zip deploy.zip

      - name: Upload unpack.php (standalone, outside the zip)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}public/
          state-name: .ftp-deploy-unpack-state.json

      - name: Upload deploy.zip
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          include: |
            deploy.zip
          exclude: |
            **/*
            !deploy.zip
          state-name: .ftp-deploy-zip-state.json
          dangerous-clean-slate: false

      - name: Unpack on the server
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/unpack.php?token=${{ secrets.DEPLOY_TOKEN }}" \
            || { echo "Unpack call failed — check FTP_SERVER_DIR/public/unpack.php was uploaded and DEPLOY_TOKEN matches server .env"; exit 1; }

      - name: Run migrations (no SSH on host)
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/deploy/migrate?token=${{ secrets.DEPLOY_TOKEN }}" \
            || echo "Migration endpoint call failed — check DEPLOY_TOKEN / APP_URL secrets, or run manually."
